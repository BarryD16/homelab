apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joplin
  template:
    metadata:
      labels:
        app: joplin
    spec:
      containers:
        - name: joplin
          image: joplin/server:latest
          ports:
            - containerPort: 22300
          env:
            - name: APP_PORT
              value: "22300"
            - name: APP_BASE_URL
              value: "https://joplin.orchestratedigital.co.uk"
            - name: DB_CLIENT
              value: "sqlite3"
            - name: SQLITE_DATABASE
              value: "/data/joplin.db"
          volumeMounts:
            - name: joplin-data
              mountPath: /data
      volumes:
        - name: joplin-data
          persistentVolumeClaim:
            claimName: joplin-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: joplin-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: joplin
  namespace: default
spec:
  selector:
    app: joplin
  ports:
    - port: 22300
      targetPort: 22300
