global:
  domain: argocd.orchestratedigital.co.uk

server:
  ingress:
    enabled: false

configs:
  params:
    server.insecure: true

redis-ha:
  enabled: false

controller:
  replicas: 1

applicationSet:
  replicas: 1

repoServer:
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
